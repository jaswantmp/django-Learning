
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Student</title>
</head>
<body style="background-color: #f5ee72; font-family: Arial, sans-serif; padding: 20px;">
    <h1>Delete Student</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ student.name }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" style="background-color: red; color: white; padding: 10px 10px; text-decoration: none; border-radius: 5px;">Yes, Delete</button>
    </form>
    <br>

    <a href="{% url 'student_home' %}" style="background-color: gray; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px;">Cancel</a>
</body>
</html>
